components:
  schemas:
    CreateEvent:
      properties:
        title:
          type: string
          maxLength: 120
          minLength: 1
          title: Title
        category_code:
          type: string
          pattern: ^(street|jdm|premium|drift)$
          title: Category Code
        starts_at:
          type: string
          format: date-time
          title: Starts At
        timezone:
          type: string
          maxLength: 64
          minLength: 1
          title: Timezone
        location_label:
          type: string
          maxLength: 200
          minLength: 1
          title: Location Label
        longitude:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Longitude
        latitude:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Latitude
        description:
          anyOf:
          - type: string
            maxLength: 2000
            minLength: 1
          - type: 'null'
          title: Description
      additionalProperties: false
      type: object
      required:
      - title
      - category_code
      - starts_at
      - timezone
      - location_label
      - longitude
      - latitude
      title: CreateEvent
    EventOutput:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        organizer_id:
          type: string
          format: uuid
          title: Organizer Id
        title:
          type: string
          title: Title
        category_code:
          type: string
          title: Category Code
        starts_at:
          type: string
          format: date-time
          title: Starts At
        timezone:
          type: string
          title: Timezone
        location_label:
          type: string
          title: Location Label
        longitude:
          type: number
          title: Longitude
        latitude:
          type: number
          title: Latitude
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        state:
          type: string
          title: State
          default: published
        visibility:
          type: string
          title: Visibility
          default: listed
        version:
          type: integer
          title: Version
      type: object
      required:
      - id
      - organizer_id
      - title
      - category_code
      - starts_at
      - timezone
      - location_label
      - longitude
      - latitude
      - description
      - version
      title: EventOutput
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
      additionalProperties: false
      type: object
      title: HealthResponse
    NearbyInput:
      properties:
        longitude:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Longitude
        latitude:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Latitude
        radius_m:
          type: number
          maximum: 50000.0
          minimum: 1.0
          title: Radius M
        from_ts:
          type: string
          format: date-time
          title: From Ts
        until_ts:
          type: string
          format: date-time
          title: Until Ts
        category_code:
          anyOf:
          - type: string
            pattern: ^(street|jdm|premium|drift)$
          - type: 'null'
          title: Category Code
        limit:
          type: integer
          maximum: 50.0
          minimum: 1.0
          title: Limit
          default: 25
        cursor:
          anyOf:
          - type: string
            maxLength: 2048
            minLength: 1
          - type: 'null'
          title: Cursor
      additionalProperties: false
      type: object
      required:
      - longitude
      - latitude
      - radius_m
      - from_ts
      - until_ts
      title: NearbyInput
    NearbyItem:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        title:
          type: string
          title: Title
        category_code:
          type: string
          title: Category Code
        starts_at:
          type: string
          format: date-time
          title: Starts At
        location_label:
          type: string
          title: Location Label
        distance_m:
          type: number
          title: Distance M
        version:
          type: integer
          title: Version
      type: object
      required:
      - id
      - title
      - category_code
      - starts_at
      - location_label
      - distance_m
      - version
      title: NearbyItem
    NearbyOutput:
      properties:
        items:
          items:
            $ref: '#/components/schemas/NearbyItem'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - items
      - next_cursor
      title: NearbyOutput
    ProfileInput:
      properties:
        nickname:
          type: string
          maxLength: 80
          minLength: 1
          title: Nickname
        avatar_style:
          anyOf:
          - type: string
            maxLength: 64
            minLength: 1
          - type: 'null'
          title: Avatar Style
        avatar_seed:
          anyOf:
          - type: string
            maxLength: 256
            minLength: 1
          - type: 'null'
          title: Avatar Seed
      additionalProperties: false
      type: object
      required:
      - nickname
      title: ProfileInput
    ProfileOutput:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        nickname:
          type: string
          title: Nickname
        avatar_style:
          anyOf:
          - type: string
          - type: 'null'
          title: Avatar Style
        avatar_seed:
          anyOf:
          - type: string
          - type: 'null'
          title: Avatar Seed
        version:
          type: integer
          title: Version
      type: object
      required:
      - user_id
      - nickname
      - avatar_style
      - avatar_seed
      - version
      title: ProfileOutput
    ProfilePatch:
      properties:
        nickname:
          type: string
          maxLength: 80
          minLength: 1
        avatar_style:
          anyOf:
          - type: string
            maxLength: 64
            minLength: 1
          - type: 'null'
          title: Avatar Style
        avatar_seed:
          anyOf:
          - type: string
            maxLength: 256
            minLength: 1
          - type: 'null'
          title: Avatar Seed
      additionalProperties: false
      type: object
      minProperties: 1
      title: ProfilePatch
    SessionOutput:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        profile_complete:
          type: boolean
          title: Profile Complete
          default: true
      type: object
      required:
      - user_id
      title: SessionOutput
  securitySchemes:
    FirebaseIDToken:
      type: http
      scheme: bearer
