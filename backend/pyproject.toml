[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nightpoint-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.165.0", "uvicorn==0.54.0", "pydantic==2.14.4",
  "SQLAlchemy==2.1.9", "psycopg[binary]==3.3.9", "alembic==1.20.1", "firebase-admin==7.8.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pyright[nodejs]==1.1.414", "httpx==0.28.1", "PyYAML==6.0.4", "openapi-spec-validator==0.9.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: isolated real PostGIS database required"]

[tool.pyright]
include = ["app", "migrations", "tests", "tools", "../infra"]
extraPaths = ["../infra"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
